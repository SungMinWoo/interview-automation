name: Deploy

# main 브랜치에 push되면 Lightsail 서버에 SSH로 접속해
# 최신 코드로 맞춘 뒤 docker compose로 재빌드·기동한다.
# 레지스트리(Docker Hub/GHCR/ECR)를 쓰지 않고 서버에서 직접 빌드하는 방식.
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 필요 시 수동 실행

# 배포가 겹치지 않도록 한 번에 하나만 실행 (이전 실행은 취소)
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true   # 한 줄이라도 실패하면 즉시 중단
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            # 최신 코드로 강제 동기화 (.env·media는 .gitignore라 보존됨)
            git fetch origin main
            git reset --hard origin/main

            # 변경된 이미지만 재빌드 후 무중단에 가깝게 재기동
            # (backend 컨테이너 command가 migrate까지 수행)
            docker compose up -d --build

            # 떠 있는 컨테이너 상태 확인 + 미사용 이미지 정리
            docker compose ps
            docker image prune -f
