<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body style="font-family: 'Apple SD Gothic Neo', sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background: #f8f9fa; border-radius: 8px; padding: 32px;">
        <h1 style="color: #1a1a2e; font-size: 24px; margin-bottom: 16px;">인터뷰 설문 요청</h1>
        <p style="color: #333; font-size: 16px; line-height: 1.6;">
            안녕하세요, <strong>{{ employee_name }}</strong>님.
        </p>
        <p style="color: #333; font-size: 16px; line-height: 1.6;">
            <strong>{{ project_title }}</strong> 프로젝트와 관련하여 인터뷰 설문을 요청드립니다.
        </p>
        <div style="background: #fff; border-radius: 8px; padding: 24px; margin: 24px 0; border: 1px solid #e0e0e0;">
            <p style="margin: 0 0 12px; color: #666;">비밀번호: <strong>{{ password_hint }}</strong></p>
            <p style="margin: 0 0 12px; color: #666;">마감일: <strong>{{ expires_at }}</strong></p>
            <a href="{{ survey_url }}" style="display: inline-block; background: #3b82f6; color: #fff; padding: 12px 32px; border-radius: 6px; text-decoration: none; font-weight: bold;">설문 참여하기</a>
        </div>
        <p style="color: #999; font-size: 13px;">본 설문 링크는 일회용이며 마감일 이후에는 접속이 불가합니다.</p>
    </div>
</body>
</html>
